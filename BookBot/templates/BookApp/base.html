<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 BookBot</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0e0c;
    --surface: #1a1814;
    --surface2: #242018;
    --border: #2e2a22;
    --gold: #c9a84c;
    --text: #f0ead8;
    --text-dim: #8a8070;
    --user-bubble: #2a2318;
    --bot-bubble: #1e1c17;
    --accent: #8b4513;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .logo { display: flex; align-items: center; gap: 12px; }

  .logo-icon {
    width: 40px; height: 40px;
    background: linear-gradient(135deg, var(--gold), var(--accent));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }

  .logo-text h1 {
    font-family: 'Playfair Display', serif;
    font-size: 20px; color: var(--gold);
  }

  .logo-text p {
    font-size: 11px; color: var(--text-dim);
    letter-spacing: 1px; text-transform: uppercase;
  }

  .reset-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 6px 14px; border-radius: 20px;
    cursor: pointer; font-size: 12px;
    font-family: 'DM Sans', sans-serif;
    text-decoration: none;
    transition: all 0.2s;
  }
  .reset-btn:hover { border-color: var(--gold); color: var(--gold); }

  #messages {
    flex: 1; overflow-y: auto;
    padding: 24px;
    display: flex; flex-direction: column; gap: 16px;
    scroll-behavior: smooth;
  }

  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .welcome {
    text-align: center; padding: 40px 20px;
  }
  .welcome .big-icon { font-size: 48px; margin-bottom: 16px; display: block; }
  .welcome h2 {
    font-family: 'Playfair Display', serif;
    font-size: 26px; color: var(--gold); margin-bottom: 8px;
  }
  .welcome p {
    color: var(--text-dim); font-size: 14px;
    max-width: 400px; margin: 0 auto 24px; line-height: 1.6;
  }

  .suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }

  /* Suggestions are submit buttons inside a form */
  .suggestions form { display: inline; }
  .suggestion-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text); padding: 8px 16px;
    border-radius: 20px; cursor: pointer;
    font-size: 13px; font-family: 'DM Sans', sans-serif;
    transition: all 0.2s;
  }
  .suggestion-btn:hover { border-color: var(--gold); color: var(--gold); }

  .message {
    display: flex; gap: 12px;
    max-width: 600px;
  }
  .message.user { align-self: flex-end; flex-direction: row-reverse; }
  .message.bot  { align-self: flex-start; }

  .avatar {
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0; margin-top: 2px;
  }
  .message.user .avatar { background: var(--user-bubble); border: 1px solid var(--border); }
  .message.bot  .avatar { background: linear-gradient(135deg, var(--gold), var(--accent)); }

  .bubble {
    padding: 12px 16px; border-radius: 16px;
    font-size: 14px; line-height: 1.65; max-width: 600px;
    border: 1px solid var(--border);
    white-space: pre-wrap; /* This makes \n actually move to a new line */
    word-wrap: break-word;
  }
  
  .message.user .bubble { background: var(--user-bubble); border-top-right-radius: 4px; }
  .message.bot  .bubble { background: var(--bot-bubble);  border-top-left-radius: 4px; }

  .source-tag { font-size: 10px; color: var(--text-dim); margin-top: 6px; letter-spacing: 0.5px; }

  .input-area {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 16px 24px; flex-shrink: 0;
  }

  .input-form {
    display: flex; gap: 10px; align-items: flex-end;
    max-width: 780px; margin: 0 auto;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 10px 10px 10px 16px;
  }
  .input-form:focus-within { border-color: var(--gold); }

  .input-form textarea {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--text); font-family: 'DM Sans', sans-serif;
    font-size: 14px; resize: none; height: 36px; line-height: 1.5;
  }
  .input-form textarea::placeholder { color: var(--text-dim); }

  .send-btn {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--gold), var(--accent));
    border: none; border-radius: 10px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-size: 16px;
  }
  .send-btn:hover { opacity: 0.9; }

  .input-hint { text-align: center; font-size: 11px; color: var(--text-dim); margin-top: 8px; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">📚</div>
    <div class="logo-text">
      <h1>BookBot</h1>
      <p>AI Book Recommender</p>
    </div>
  </div>
  <a href="{% url 'reset' %}" class="reset-btn">↺ New Chat</a>
</header>

<div id="messages">
    {% block content %}
    
    {% endblock %}
</div>
 

<div class="input-area">
  <form method="POST" action="{% url 'chat' %}" class="input-form">
    {% csrf_token %}
    <textarea name="message" placeholder="Ask for a book recommendation..." required></textarea>
    <button type="submit" class="send-btn">➤</button>
  </form>
  <p class="input-hint">Press the button to send</p>
</div>

</body>
</html>
